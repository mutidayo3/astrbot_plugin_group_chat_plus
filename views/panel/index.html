<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Chat Plus 管理面板</title>
    <link rel="icon" href="./static/img/logo.png">
    <link rel="stylesheet" href="./static/css/main.css">
    <link rel="stylesheet" href="./static/css/tech-tree.css">
    <link rel="stylesheet" href="./static/css/config-panel.css">
    <link rel="stylesheet" href="./static/css/charts.css">
    <meta name="robots" content="noindex, nofollow">
</head>
<body>

    <!-- 主界面 -->
    <div id="page-main" class="page hidden">

        <!-- 移动端：侧边栏遮罩 -->
        <div id="sidebar-overlay"></div>

        <!-- 移动端：顶部栏 -->
        <div id="mobile-topbar">
            <button id="btn-mobile-menu" class="btn-icon" aria-label="打开菜单">☰</button>
            <div class="mobile-topbar-brand">
                <span id="mobile-topbar-title">配置流程图</span>
                <span class="mobile-topbar-version">V1.2.4.hotfix.2</span>
            </div>
        </div>

        <!-- 侧边栏 -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <img src="./static/img/logo.png" alt="Logo" class="sidebar-logo">
                <div class="sidebar-brand">
                    <span class="sidebar-title">GCP 面板</span>
                    <span class="sidebar-version">V1.2.4.hotfix.2</span>
                </div>
            </div>
            <ul class="nav-list">
                <li class="nav-item active" data-view="tech-tree">
                    <span class="nav-icon">🌳</span> 配置流程图
                </li>
                <li class="nav-item" data-view="charts">
                    <span class="nav-icon">📊</span> 数据可视化
                </li>
                <li class="nav-item" data-view="sessions">
                    <span class="nav-icon">💬</span> 会话管理
                </li>
                <li class="nav-item" data-view="commands">
                    <span class="nav-icon">⚡</span> 指令执行
                </li>
                <li class="nav-item" data-view="settings">
                    <span class="nav-icon">⚙️</span> 核心设置
                </li>
                <li class="nav-item" data-view="files">
                    <span class="nav-icon">📁</span> 文件管理
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="sidebar-notice">
                    <span>免费开源插件 · </span>
                    <a href="https://github.com/Him666233/astrbot_plugin_group_chat_plus"
                       target="_blank" rel="noopener noreferrer">GitHub</a>
                    <span> · QQ群 1021544792</span>
                </div>
                <button id="btn-theme-toggle" class="btn btn-sm">🌙 切换主题</button>
                <button id="btn-support-author" class="btn btn-sm">❤️ 支持作者</button>
                <button id="btn-feedback" class="btn btn-sm">🐛 反馈BUG</button>
            </div>
        </nav>

        <!-- 内容区 -->
        <main id="content">
            <!-- 科技树视图 -->
            <div id="view-tech-tree" class="view active">
                <div class="view-header">
                    <h2>消息处理流程图</h2>
                    <div id="flow-search-wrap" class="flow-search-wrap">
                        <span class="flow-search-icon">🔍</span>
                        <input id="flow-search-input" type="text"
                               placeholder="搜索配置项、步骤名称..."
                               autocomplete="off">
                        <div id="flow-search-results" class="flow-search-results hidden"></div>
                    </div>
                    <div class="view-actions">
                        <button id="btn-save-config" class="btn btn-primary btn-sm hidden">
                            💾 保存并重启插件
                        </button>
                        <button id="btn-reload" class="btn btn-sm">🔄 重启插件</button>
                    </div>
                </div>
                <div id="flow-breadcrumb" class="flow-breadcrumb hidden"></div>
                <div id="tech-tree-wrapper">
                    <div id="tech-tree-canvas"></div>
                    <div id="zoom-ctrl" class="zoom-ctrl hidden">
                        <button class="zoom-ctrl-in" title="放大">+</button>
                        <button class="zoom-ctrl-fit" title="适应屏幕">⊡</button>
                        <button class="zoom-ctrl-out" title="缩小">−</button>
                    </div>
                    <div id="config-panel" class="config-panel">
                        <div class="config-panel-header">
                            <h3 id="config-panel-title">配置项</h3>
                            <button id="btn-close-panel" class="btn-icon">✕</button>
                        </div>
                        <div id="config-panel-body"></div>
                        <div id="config-panel-footer" class="config-panel-footer">
                            <span id="config-panel-save-status" class="config-panel-save-status">暂无未保存修改</span>
                            <button id="btn-save-config-panel" class="btn btn-primary btn-sm" disabled>
                                💾 保存并重载
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 数据可视化视图 -->
            <div id="view-charts" class="view hidden">
                <div class="view-header">
                    <h2>数据可视化</h2>
                    <div class="charts-header-right">
                        <button id="btn-refresh-charts" class="btn btn-sm" title="手动刷新数据">🔄 刷新</button>
                        <label class="auto-refresh-toggle">
                            <span class="dot active" id="charts-refresh-dot"></span>
                            <input type="checkbox" checked id="charts-auto-refresh">
                            <span>自动刷新（3秒）</span>
                        </label>
                        <select id="chart-session-select" class="select-sm">
                            <option value="">选择会话...</option>
                        </select>
                    </div>
                </div>
                <div id="charts-grid"></div>
            </div>

            <!-- 会话管理视图 -->
            <div id="view-sessions" class="view hidden">
                <div class="view-header">
                    <h2>会话管理</h2>
                </div>
                <div id="session-list-container"></div>
                <div id="session-detail" class="hidden"></div>
            </div>

            <!-- 指令执行视图 -->
            <div id="view-commands" class="view hidden">
                <div class="view-header">
                    <h2>指令执行</h2>
                </div>
                <div id="commands-container"></div>
            </div>

            <!-- 面板设置视图 -->
            <div id="view-settings" class="view hidden">
                <div class="view-header">
                    <h2>Web 核心设置</h2>
                </div>
                <div id="settings-container"></div>
            </div>

            <!-- 文件管理视图 -->
            <div id="view-files" class="view hidden">
                <div class="view-header">
                    <h2>文件管理</h2>
                </div>
                <div id="files-container"></div>
            </div>
        </main>
    </div>

    <!-- Toast 通知 -->
    <div id="toast-container"></div>

    <!-- AstrBot 插件视图 bridge（为保证顺序显式引入） -->
    <script src="/api/plugin/page/bridge-sdk.js"></script>

    <!-- JS（插件视图，静态资源由 AstrBot 以路径令牌提供） -->
    <script src="./static/js/utils.js"></script>
    <script src="./static/js/api.js"></script>
    <script src="./static/js/flow-data.js"></script>
    <script src="./static/js/prompt-data.js"></script>
    <script src="./static/js/tech-tree.js"></script>
    <script src="./static/js/config-editor.js"></script>
    <script src="./static/js/charts.js"></script>
    <script src="./static/js/session-mgr.js"></script>
    <script src="./static/js/app.js"></script>

    <!-- 移动端侧边栏抽屉控制 -->
    <script>
    (function() {
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebar-overlay');
        var menuBtn = document.getElementById('btn-mobile-menu');
        if (!sidebar || !overlay || !menuBtn) return;

        function openSidebar() {
            sidebar.classList.add('sidebar-open');
            overlay.classList.add('visible');
        }
        function closeSidebar() {
            sidebar.classList.remove('sidebar-open');
            overlay.classList.remove('visible');
        }

        menuBtn.addEventListener('click', openSidebar);
        overlay.addEventListener('click', closeSidebar);

        // 点击导航项后关闭抽屉，并更新顶部栏标题
        sidebar.addEventListener('click', function(e) {
            var item = e.target.closest('.nav-item');
            if (!item) return;
            if (window.innerWidth < 768) {
                closeSidebar();
                var titleEl = document.getElementById('mobile-topbar-title');
                if (titleEl) {
                    var icon = item.querySelector('.nav-icon');
                    var text = item.textContent.trim();
                    if (icon) text = text.replace(icon.textContent, '').trim();
                    titleEl.textContent = text;
                }
            }
        });
    })();
    </script>
</body>
</html>
